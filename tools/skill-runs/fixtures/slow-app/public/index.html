<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgerboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500;600;700;800;900&display=block">
<script src="/app.js"></script>
</head><body style="font-family:Inter,sans-serif;margin:0">
<img src="/hero.png" alt="Dashboard preview" style="width:100%">
<h1>Ledgerboard</h1><p>Your receivables at a glance.</p><div id="stats">Loading…</div>
<script>fetch('/api/stats').then(r => r.json()).then(s => { document.getElementById('stats').textContent = s.customers + ' customers tracked' })</script>
</body></html>
