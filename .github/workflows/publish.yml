name: publish

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 6 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Job to run
        type: choice
        options: [publish, discover]
        default: publish

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: unit tests
        run: python -m unittest discover -s tools/agent-skills/tests -v
      - name: generated surfaces are current
        run: |
          python tools/agent-skills/gen_home.py --check
          python tools/agent-skills/gen_page.py --check
      - name: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH: gh
        run: python tools/agent-skills/build.py
      - name: sitemap
        run: python tools/agent-skills/gen_sitemap.py --write
      - name: dist
        run: bash tools/agent-skills/make_dist.sh
      - name: gate
        run: python tools/agent-skills/check_dist.py
      - name: verify
        run: node tools/agent-skills/verify.mjs local

  publish:
    if: github.event_name == 'push' || github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'publish')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    concurrency:
      group: publish-skills-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: unit tests
        run: python -m unittest discover -s tools/agent-skills/tests -v
      - name: generated surfaces are current
        run: |
          python tools/agent-skills/gen_home.py --check
          python tools/agent-skills/gen_page.py --check
      - name: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH: gh
        run: python tools/agent-skills/build.py
      - name: sitemap
        run: python tools/agent-skills/gen_sitemap.py --write
      - name: dist
        run: bash tools/agent-skills/make_dist.sh
      - name: gate
        run: python tools/agent-skills/check_dist.py
      - name: verify local
        run: node tools/agent-skills/verify.mjs local
      - name: preflight secrets
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -n "$CF_TOKEN" ] || { echo "::error::CLOUDFLARE_API_TOKEN is not set in Settings → Secrets and variables → Actions"; exit 1; }
          [ -n "$CF_ACCOUNT" ] || { echo "::error::CLOUDFLARE_ACCOUNT_ID is not set in Settings → Secrets and variables → Actions"; exit 1; }
      - name: install wrangler
        run: npm install --no-save wrangler@4.151.1
      - name: deploy
        id: deploy
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          npx wrangler pages deploy dist --project-name skills --branch main 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[a-f0-9]+\.skills\.pages\.dev' deploy.log | tail -1 || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployment: ${url:-not reported}" >> "$GITHUB_STEP_SUMMARY"
      - name: verify live
        env:
          CACHE_BUST: ${{ github.sha }}
        run: node tools/agent-skills/verify.mjs https://skills.caffeinity.com
      - name: prove live
        run: python tools/agent-skills/prove.py --site https://skills.caffeinity.com --bust "${{ github.sha }}"
      - name: summary
        if: always()
        run: |
          {
            echo "## skills-site publish"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- deployment: ${{ steps.deploy.outputs.url }}"
            echo "- archives: $(ls out/*.tar.gz 2>/dev/null | wc -l)"
          } >> "$GITHUB_STEP_SUMMARY"

  discover:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'discover')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: discover-skills-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: shape report
        env:
          GH_TOKEN: ${{ github.token }}
          GH: gh
        run: python tools/agent-skills/discover.py --report | tee report.txt
      - name: proposal
        env:
          GH_TOKEN: ${{ github.token }}
          GH: gh
        run: python tools/agent-skills/discover.py --propose
