name: publish

# Anything live on GitHub reaches main without a human merge: every hour
# sync.py adds new skill repos, refreshes generated pages whose repo moved,
# follows renames (with 301s) and drops repos that went away. The build and
# every gate must pass before the sync is committed. CI holds no Cloudflare
# credentials: the owner deploys main from their own machine with
# tools/agent-skills/deploy.sh, and this job keeps one "Deploy pending" issue
# open while the live site is behind.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [skill-updated]

permissions:
  contents: read

concurrency:
  group: publish-skills-site
  cancel-in-progress: false

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: unit tests
        run: python -m unittest discover -s tools/agent-skills/tests -v
      - name: generated surfaces are current
        run: |
          python tools/agent-skills/gen_home.py --check
          python tools/agent-skills/gen_page.py --check
      - name: sync preview (read-only)
        env:
          GH_TOKEN: ${{ github.token }}
          GH: gh
        run: python tools/agent-skills/sync.py --summary "$GITHUB_STEP_SUMMARY"
      - name: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH: gh
        run: python tools/agent-skills/build.py
      - name: sitemap
        run: python tools/agent-skills/gen_sitemap.py --write
      - name: dist
        run: bash tools/agent-skills/make_dist.sh
      - name: gate
        run: python tools/agent-skills/check_dist.py
      - name: verify
        run: node tools/agent-skills/verify.mjs local

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: sync with GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          GH: gh
        run: python tools/agent-skills/sync.py --write --summary "$GITHUB_STEP_SUMMARY" | tee "$RUNNER_TEMP/sync.txt"
      - name: unit tests
        run: python -m unittest discover -s tools/agent-skills/tests -v
      - name: generated surfaces are current
        run: |
          python tools/agent-skills/gen_home.py --check
          python tools/agent-skills/gen_page.py --check
      - name: build
        env:
          GH_TOKEN: ${{ github.token }}
          GH: gh
        run: python tools/agent-skills/build.py
      - name: sitemap
        run: python tools/agent-skills/gen_sitemap.py --write
      - name: dist
        run: bash tools/agent-skills/make_dist.sh
      - name: gate
        run: python tools/agent-skills/check_dist.py
      - name: verify local
        run: node tools/agent-skills/verify.mjs local
      - name: commit the sync back to main
        run: |
          set -euo pipefail
          [ -n "$(git status --porcelain)" ] || { echo "- sync: nothing new" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: add what is live on GitHub" -m "$(head -40 "$RUNNER_TEMP/sync.txt")"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: flag a pending deploy
        # CI holds no Cloudflare credentials; the owner deploys from their own machine with
        # tools/agent-skills/deploy.sh. dist/version.json hashes the whole build, so this
        # compares what main would publish with what is live, and nothing the CDN injects counts.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          title="Deploy pending: skills.caffeinity.com is behind main"
          live=$(curl -fsS "https://skills.caffeinity.com/version.json?v=$GITHUB_RUN_ID" || true)
          open=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ "$live" = "$(cat dist/version.json)" ]; then
            echo "- live site matches main" >> "$GITHUB_STEP_SUMMARY"
            [ -z "$open" ] || gh issue close "$open" --comment "Live site now matches main ($(cat dist/version.json))."
            exit 0
          fi
          echo "- live site is behind main: run tools/agent-skills/deploy.sh" >> "$GITHUB_STEP_SUMMARY"
          [ -n "$open" ] && exit 0
          printf '%s\n' \
            "The build on main differs from what skills.caffeinity.com serves." "" \
            "Deploy from your machine (no secrets in CI):" "" \
            '```' "git pull && bash tools/agent-skills/deploy.sh" '```' "" \
            "or ask Claude Code to \"deploy the skills site\". This issue closes itself once the live site matches." \
            > "$RUNNER_TEMP/issue.md"
          gh issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md"
